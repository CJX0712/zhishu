# 智枢 ZhiShu — 一键起全栈
# 用法：
#   docker compose up -d --build          # 起 qdrant + ollama + backend(含前端)
#   docker compose exec -T ollama ollama pull qwen2.5:1.5b   # 首次拉本地模型
#   docker compose exec -T backend zhishu ingest data/docs/sample.txt
# 或零下载（云端兜底）：在 backend.environment 设置 ZHISHU_LLM_MODE=cloud 与 ZHISHU_LLM_CLOUD_API_KEY
services:
  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    ports:
      - "8000:8000"
    environment:
      ZHISHU_LLM_MODE: hybrid
      ZHISHU_LLM_LOCAL_BASE_URL: http://ollama:11434/v1
      ZHISHU_LLM_LOCAL_MODEL: qwen2.5:1.5b
      ZHISHU_QDRANT_HOST: qdrant
      ZHISHU_QDRANT_PORT: "6333"
      # 云端兜底（可选）：ZHISHU_LLM_CLOUD_API_KEY / ZHISHU_LLM_CLOUD_BASE_URL / ZHISHU_LLM_CLOUD_MODEL
    depends_on:
      - qdrant
      - ollama
    restart: unless-stopped

volumes:
  qdrant_data:
  ollama_data:
